        .toggle-switch { position: relative; width: 34px; height: 18px; flex-shrink: 0; }

        .toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 18px; transition: 0.2s; cursor: pointer; }
        .toggle-slider:before { content: ''; position: absolute; height: 12px; width: 12px; left: 3px; top: 3px; background: #5a7099; border-radius: 50%; transition: 0.2s; }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); background: white; }
        .leaflet-popup-content-wrapper { background: #0f1624 !important; border: 1px solid #1e2a45 !important; border-radius: 10px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important; color: #c8d6ef !important; }

  {bolge:"Ladik Camiyanı",yagis:38,dere:1.4,egim:4,altyapi:4,sel:1,nufus:1,lat:40.93,lon:35.87,sinif:"Dusuk"},
  {bolge:"Ayvacik Yesilyurt",yagis:78,dere:2.9,egim:1,altyapi:2,sel:4,nufus:2,lat:40.97,lon:36.64,sinif:"Yuksek"},
  {bolge:"Salipazari Yavas",yagis:72,dere:2.6,egim:2,altyapi:2,sel:3,nufus:2,lat:41.09,lon:36.81,sinif:"Orta"},
  {bolge:"Ondokuzmayis Dereboyu",yagis:76,dere:3.0,egim:2,altyapi:2,sel:3,nufus:3,lat:41.52,lon:36.06,sinif:"Yuksek"},
  {bolge:"Alacam Sahil",yagis:68,dere:2.5,egim:2,altyapi:3,sel:3,nufus:2,lat:41.63,lon:35.6,sinif:"Orta"},
  {bolge:"Ilkadim Kıran",yagis:52,dere:2.0,egim:3,altyapi:4,sel:2,nufus:3,lat:41.26,lon:36.3,sinif:"Orta"},
  {bolge:"Canik Yayla",yagis:35,dere:1.2,egim:4,altyapi:4,sel:1,nufus:2,lat:41.25,lon:36.38,sinif:"Dusuk"},
  {bolge:"Atakum Çakırlar",yagis:64,dere:2.5,egim:2,altyapi:3,sel:2,nufus:3,lat:41.39,lon:36.15,sinif:"Orta"},
  {bolge:"Tekkekoy Selyeri",yagis:82,dere:3.1,egim:1,altyapi:2,sel:4,nufus:3,lat:41.22,lon:36.47,sinif:"Yuksek"},
  {bolge:"Bafra Dedeli",yagis:48,dere:1.7,egim:3,altyapi:4,sel:2,nufus:2,lat:41.53,lon:35.92,sinif:"Dusuk"},
  {bolge:"Carsamba Dikbiyik",yagis:60,dere:2.2,egim:2,altyapi:3,sel:2,nufus:3,lat:41.21,lon:36.6,sinif:"Orta"},
  {bolge:"Terme Akçagün",yagis:65,dere:2.4,egim:2,altyapi:3,sel:3,nufus:2,lat:41.18,lon:36.99,sinif:"Orta"},
  {bolge:"Havza Bekdiğin",yagis:30,dere:1.1,egim:4,altyapi:4,sel:0,nufus:2,lat:41.02,lon:35.7,sinif:"Dusuk"},
  {bolge:"Kavak Mahmutlu",yagis:48,dere:1.7,egim:3,altyapi:4,sel:1,nufus:2,lat:41.05,lon:36.02,sinif:"Dusuk"},
  {bolge:"Ladik Mazlumoğlu",yagis:32,dere:1.2,egim:4,altyapi:5,sel:1,nufus:1,lat:40.89,lon:35.91,sinif:"Dusuk"},
  {bolge:"Ayvacik Orhangazi",yagis:80,dere:3.0,egim:1,altyapi:2,sel:4,nufus:3,lat:41.0,lon:36.62,sinif:"Yuksek"}
];

var C = {Kritik:'#e63946', Yuksek:'#ff6b35', Orta:'#f5c518', Dusuk:'#00c48c'};
function getColor(s) { return C[s] || '#888'; }
function radiusFor(s) { return {Kritik:11,Yuksek:9,Orta:7,Dusuk:5}[s] || 6; }

function calcScore(d) {
    var ny = Math.min(d.yagis/100,1);
    var nd = Math.min(d.dere/4,1);
    var ne = 1-(d.egim-1)/4;
    var na = 1-(d.altyapi-1)/4;
    var ns = Math.min(d.sel/5,1);
    var nn = Math.min(d.nufus/5,1);
    return (ny*0.30 + nd*0.25 + ne*0.15 + na*0.15 + ns*0.10 + nn*0.05)*100;
}

var tileLayers = {
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {attribution:'© OpenStreetMap © CARTO',maxZoom:20,subdomains:'abcd'}),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {attribution:'© OpenTopoMap',maxZoom:17}),
    sat:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution:'© Esri',maxZoom:18}),
};

var map = L.map('map', {center:[41.28,36.30],zoom:11,layers:[tileLayers.dark]});

var layerHeat   = L.layerGroup().addTo(map);
var layerKritik = L.layerGroup().addTo(map);
var layerYuksek = L.layerGroup().addTo(map);
var layerDiger  = L.layerGroup().addTo(map);

var counts = {Kritik:0,Yuksek:0,Orta:0,Dusuk:0};
var heatPoints = [];

var ONERI = {
    Kritik: 'Acil tahliye başlatılmalı. AFAD ve belediye ekipleri yönlendirilmeli.',
    Yuksek: 'Bölge izlemeye alınmalı, hazırlık ekipleri konuşlandırılmalı.',
    Orta:   'Düzenli izleme yapılmalı, altyapı kontrolleri sürdürülmeli.',
    Dusuk:  'Rutin denetimler yeterli. Erken uyarı sistemleri aktif tutulmalı.'
};

rawData.forEach(function(d) {
    counts[d.sinif]++;
    var score = calcScore(d);
    var pct = score.toFixed(1);
    var col = getColor(d.sinif);
    var w = {Kritik:1.0,Yuksek:0.75,Orta:0.45,Dusuk:0.2}[d.sinif] || 0.3;
    heatPoints.push([d.lat, d.lon, w]);

    var popupHtml = '<div class="popup-inner">'
        + '<h3>' + d.bolge + '</h3>'
        + '<span class="risk-badge" style="background:' + col + '22;color:' + col + ';border:1px solid ' + col + '44">' + d.sinif.toUpperCase() + ' RİSK</span>'
        + '<div class="score-row"><div class="score-bar-bg"><div class="score-bar-fill" style="width:' + pct + '%;background:' + col + '"></div></div><span class="score-val" style="color:' + col + '">' + pct + '</span></div>'
        + '<div class="popup-grid">'
        + '<div class="popup-metric"><div class="pm-label">Yağış</div><div class="pm-value" style="color:' + col + '">' + d.yagis + ' mm</div></div>'
        + '<div class="popup-metric"><div class="pm-label">Dere Seviyesi</div><div class="pm-value" style="color:' + col + '">' + d.dere + ' m</div></div>'
        + '<div class="popup-metric"><div class="pm-label">Zemin Eğimi</div><div class="pm-value">' + d.egim + '/5</div></div>'
        + '<div class="popup-metric"><div class="pm-label">Geçmiş Sel</div><div class="pm-value">' + d.sel + ' kez</div></div>'
        + '<div class="popup-metric"><div class="pm-label">Altyapı</div><div class="pm-value">' + d.altyapi + '/5</div></div>'
        + '<div class="popup-metric"><div class="pm-label">Nüfus Yoğ.</div><div class="pm-value">' + d.nufus + '/5</div></div>'
        + '</div>'
        + '<div class="popup-oneri">⚡ <b>Öneri:</b> ' + ONERI[d.sinif] + '</div>'
        + '</div>';

    var marker = L.circleMarker([d.lat, d.lon], {
        radius: radiusFor(d.sinif),
        color: col, fillColor: col, fillOpacity: 0.85, weight: 1.5, opacity: 1
    }).bindPopup(popupHtml, {maxWidth:280})
      .bindTooltip('<b>' + d.bolge + '</b> · ' + d.sinif + ' · ' + pct + ' puan', {sticky:true});

    if (d.sinif === 'Kritik') {
        var pulse = L.divIcon({html:'<div class="pulse-icon"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
        L.marker([d.lat,d.lon],{icon:pulse}).bindTooltip('⚠ KRİTİK: ' + d.bolge,{sticky:true}).addTo(layerKritik);
        marker.addTo(layerKritik);
    } else if (d.sinif === 'Yuksek') {
        marker.addTo(layerYuksek);
    } else {
        marker.addTo(layerDiger);
    }
});

if (L.heatLayer) {
    L.heatLayer(heatPoints, {radius:28,blur:20,minOpacity:0.25,gradient:{0.0:'#00c48c',0.4:'#f5c518',0.7:'#ff6b35',1.0:'#e63946'}}).addTo(layerHeat);
}

document.getElementById('stat-kritik').textContent = counts.Kritik;
document.getElementById('stat-yuksek').textContent = counts.Yuksek;
document.getElementById('stat-orta').textContent   = counts.Orta;
document.getElementById('stat-dusuk').textContent  = counts.Dusuk;
document.getElementById('stat-toplam').textContent = counts.Kritik + counts.Yuksek + counts.Orta + counts.Dusuk;

document.getElementById('tog-heat').addEventListener('change', function(e)   { e.target.checked ? layerHeat.addTo(map)   : map.removeLayer(layerHeat);   });
document.getElementById('tog-kritik').addEventListener('change', function(e) { e.target.checked ? layerKritik.addTo(map) : map.removeLayer(layerKritik); });
document.getElementById('tog-yuksek').addEventListener('change', function(e) { e.target.checked ? layerYuksek.addTo(map) : map.removeLayer(layerYuksek); });
document.getElementById('tog-diger').addEventListener('change', function(e)  { e.target.checked ? layerDiger.addTo(map)  : map.removeLayer(layerDiger);  });
document.getElementById('base-sel').addEventListener('change', function(e) {
    Object.values(tileLayers).forEach(function(t) { map.removeLayer(t); });
    tileLayers[e.target.value].addTo(map);
    tileLayers[e.target.value].bringToBack();
});
</script>
</body>
</html>
